services:
  ggs-demo:
    build: .
    container_name: ggs-demo
    environment:
      - GGS_CONFIG_PATH=config.yaml
    ports:
      - "8000:8000"
    volumes:
      - ./system_events.log:/app/system_events.log

  cowrie:
    image: cowrie/cowrie:latest
    container_name: ggs-cowrie
    ports:
      - "2222:2222"
    volumes:
      - cowrie-logs:/cowrie/var/log/cowrie

  cowrie-bridge:
    build: .
    container_name: ggs-cowrie-bridge
    environment:
      - GGS_CONFIG_PATH=config.yaml
    command: ["python", "-c", "from core.cowrie_bridge import ingest_cowrie_log; ingest_cowrie_log('/cowrie/var/log/cowrie/cowrie.json', log_path='system_events.log')"]
    volumes:
      - cowrie-logs:/cowrie/var/log/cowrie
      - ./system_events.log:/app/system_events.log
    depends_on:
      - cowrie

  prometheus:
    image: prom/prometheus:latest
    container_name: ggs-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

volumes:
  cowrie-logs: